<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root{
      --navy:#0f2747;
      --navy-2:#153562;
      --navy-3:#1c4079;
      --gold:#ffc93c;
      --gold-2:#ffb800;
      --ink:#0b1c33;
      --muted:#64748b;
      --bg:#f4f6fb;
      --card:#ffffff;
      --border:#e6eaf2;
      --success:#16a34a;
      --success-bg:#e9f9ef;
      --danger:#dc2626;
      --danger-bg:#fdecec;
      --warn:#d97706;
      --warn-bg:#fef3e2;
      --radius:18px;
      --radius-sm:12px;
      --shadow: 0 10px 30px -12px rgba(15,39,71,.18);
      --shadow-lg: 0 20px 50px -16px rgba(15,39,71,.28);
      --mtn:#ffcb05;
      --mtn-ink:#3a2f00;
      --telecel:#e2001a;
      --at-1:#ed1c24;
      --at-2:#0033a0;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg);
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
    }
    a{color:inherit;text-decoration:none;}
    button{font-family:inherit;cursor:pointer;}
    input,select,textarea{font-family:inherit;}
    ::-webkit-scrollbar{width:8px;height:8px;}
    ::-webkit-scrollbar-thumb{background:#c9d3e3;border-radius:8px;}

    #app{min-height:100vh;}
    .hidden{display:none !important;}
    .ico{display:inline-block;vertical-align:-4px;flex-shrink:0;}
    .btn .ico{vertical-align:-3px;margin-right:2px;}

    /* ---------- Loading ---------- */
    .boot-loader{
      min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;
      background:radial-gradient(circle at 30% 20%, var(--navy-3), var(--navy) 70%);
      color:#fff;
    }
    .spinner{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:var(--gold);animation:spin 0.8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* ---------- Shared layout ---------- */
    .nav{
      position:sticky;top:0;z-index:50;
      background:linear-gradient(120deg,var(--navy),var(--navy-2) 60%,var(--navy-3));
      color:#fff;
      padding:14px 20px;
      display:flex;align-items:center;justify-content:space-between;
      box-shadow:var(--shadow);
    }
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:.2px;min-width:0;}
    .brand > div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .brand .logo{
      width:38px;height:38px;border-radius:11px;flex-shrink:0;
      background:linear-gradient(145deg,var(--gold),var(--gold-2));
      display:flex;align-items:center;justify-content:center;color:var(--navy);
      box-shadow:0 4px 12px rgba(255,184,0,.4);
    }
    .brand small{display:block;font-weight:400;font-size:11px;color:#c8d4ea;letter-spacing:.4px;overflow:hidden;text-overflow:ellipsis;}
    .nav-actions{display:flex;gap:10px;align-items:center;flex-shrink:0;}
    .icon-btn{
      background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;
      width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
      transition:.15s;flex-shrink:0;
    }
    .icon-btn:hover{background:rgba(255,255,255,.22);}
    @media(max-width:400px){
      .nav{padding:12px 14px;gap:10px;}
      .brand{font-size:16px;gap:8px;}
      .brand .logo{width:34px;height:34px;}
      .icon-btn{width:36px;height:36px;}
    }

    .btn{
      border:none;border-radius:12px;padding:12px 18px;font-weight:700;font-size:14.5px;
      transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
    }
    .btn:active{transform:scale(.97);}
    .btn-gold{background:linear-gradient(145deg,var(--gold),var(--gold-2));color:var(--navy);box-shadow:0 8px 20px -8px rgba(255,184,0,.6);}
    .btn-gold:hover{box-shadow:0 10px 26px -6px rgba(255,184,0,.7);}
    .btn-navy{background:linear-gradient(145deg,var(--navy-2),var(--navy));color:#fff;box-shadow:0 8px 20px -10px rgba(15,39,71,.6);}
    .btn-outline{background:#fff;color:var(--navy);border:1.5px solid var(--border);}
    .btn-outline:hover{border-color:var(--navy-3);}
    .btn-danger{background:var(--danger-bg);color:var(--danger);}
    .btn-success{background:var(--success-bg);color:var(--success);}
    .btn-sm{padding:8px 12px;font-size:13px;border-radius:9px;}
    .btn-block{width:100%;}
    .btn[disabled]{opacity:.55;cursor:not-allowed;}

    .container{max-width:960px;margin:0 auto;padding:0 18px;}
    .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;}
    .muted{color:var(--muted);}
    .section-title{font-size:22px;font-weight:800;margin:0 0 4px;color:var(--navy);display:flex;align-items:center;gap:9px;}
    .section-sub{color:var(--muted);font-size:14px;margin:0 0 18px;}

    /* ---------- Toasts ---------- */
    #toast-stack{position:fixed;top:16px;right:16px;z-index:999;display:flex;flex-direction:column;align-items:flex-end;gap:10px;max-width:340px;pointer-events:none;}
    #toast-stack .toast{pointer-events:auto;max-width:100%;}
    @media(max-width:400px){ #toast-stack{left:16px;max-width:none;} }
    .toast{
      background:var(--navy);color:#fff;padding:13px 16px;border-radius:12px;box-shadow:var(--shadow-lg);
      font-size:14px;animation:slideIn .25s ease;
    }
    .toast.error{background:var(--danger);}
    .toast.success{background:var(--success);}
    @keyframes slideIn{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}

    /* ---------- Store: live status banner (moving ticker) ---------- */
    .status-banner{
      overflow:hidden;white-space:nowrap;
      padding:9px 0;font-size:13px;font-weight:700;color:#fff;
    }
    .status-banner.status-good{background:linear-gradient(90deg,#0fae7a,#12c98d);}
    .status-banner.status-delayed{background:linear-gradient(90deg,#d97706,#f4a52a);}
    .status-banner.status-down{background:linear-gradient(90deg,#c81e34,#e8394f);}
    .status-banner .marquee-track{
      display:inline-flex;align-items:center;padding-left:100%;
      animation:marquee 22s linear infinite;
    }
    .status-banner:hover .marquee-track{animation-play-state:paused;}
    @keyframes marquee{
      from{transform:translateX(0);}
      to{transform:translateX(-100%);}
    }
    @media (prefers-reduced-motion: reduce){
      .status-banner .marquee-track{animation:none;padding-left:16px;}
      .status-banner{overflow-x:auto;}
    }

    /* ---------- Store: carousel ---------- */
    .carousel{position:relative;width:100%;aspect-ratio:16/6;overflow:hidden;background:linear-gradient(120deg,var(--navy),var(--navy-2));}
    @media(max-width:640px){ .carousel{aspect-ratio:4/3;} }
    .carousel-slide{
      position:absolute;inset:0;opacity:0;transition:opacity .9s ease;
    }
    .carousel-slide.active{opacity:1;}
    .carousel-slide img{width:100%;height:100%;object-fit:cover;display:block;}
    .carousel-slide::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(11,28,51,.55),transparent 45%);}
    .carousel-caption{
      position:absolute;left:20px;right:20px;bottom:34px;color:#fff;font-weight:800;font-size:17px;
      text-shadow:0 2px 10px rgba(0,0,0,.55);z-index:2;
    }
    .carousel-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:3;}
    .carousel-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5);border:none;padding:0;cursor:pointer;transition:.2s;}
    .carousel-dot.active{background:#fff;width:22px;border-radius:5px;}
    .carousel-arrow{
      position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:36px;height:36px;border-radius:50%;
      background:rgba(11,28,51,.4);color:#fff;border:none;display:flex;align-items:center;justify-content:center;
    }
    .carousel-arrow:hover{background:rgba(11,28,51,.65);}
    .carousel-arrow.prev{left:12px;}
    .carousel-arrow.next{right:12px;}
    @media(max-width:640px){ .carousel-arrow{display:none;} }

    .carousel-admin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:16px;}
    .carousel-admin-item{border-radius:14px;overflow:hidden;border:1px solid var(--border);background:#fff;}
    .carousel-admin-item img{width:100%;height:100px;object-fit:cover;display:block;background:var(--bg);}
    .carousel-admin-item .ci-body{padding:10px;}
    .carousel-admin-item .ci-caption{font-size:12px;color:var(--muted);margin-bottom:8px;min-height:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

    /* ---------- Store: hero ---------- */
    .hero{
      background:
        radial-gradient(circle at 15% 0%, rgba(255,201,60,.18), transparent 45%),
        radial-gradient(circle at 90% 10%, rgba(28,64,121,.5), transparent 55%),
        linear-gradient(135deg,var(--navy),var(--navy-2) 55%, var(--navy-3));
      color:#fff;padding:38px 0 46px;
    }
    .hero h1{font-size:30px;margin:0 0 8px;font-weight:800;}
    .hero p{margin:0 0 20px;color:#cfd9ee;font-size:15px;max-width:520px;}
    .trust-row{display:flex;gap:10px;flex-wrap:wrap;}
    .trust-chip{
      background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
      padding:8px 13px;border-radius:999px;font-size:12.5px;font-weight:600;
      display:flex;align-items:center;gap:6px;
    }
    @media(max-width:480px){
      .hero{padding:28px 0 40px;}
      .hero h1{font-size:23px;}
      .hero p{font-size:13.5px;}
      .trust-chip{font-size:11.5px;padding:7px 11px;}
    }

    /* ---------- Network tabs ---------- */
    .net-tabs{display:flex;gap:10px;margin:-24px 0 22px;position:relative;z-index:2;flex-wrap:wrap;}
    .net-tab{
      padding:12px 20px;border-radius:14px;font-weight:800;font-size:14.5px;border:2px solid transparent;
      background:#fff;color:var(--navy);box-shadow:var(--shadow);transition:.15s;
      display:inline-flex;align-items:center;gap:7px;
    }
    .net-tab.active[data-net="MTN"]{background:var(--mtn);color:var(--mtn-ink);border-color:#e0b600;}
    .net-tab.active[data-net="Telecel"]{background:var(--telecel);color:#fff;border-color:#a8000f;}
    .net-tab.active[data-net="AirtelTigo"]{background:linear-gradient(120deg,var(--at-1),var(--at-2));color:#fff;border-color:#0033a0;}

    /* ---------- Package grid ---------- */
    .pkg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:36px;}
    .pkg-card{
      background:#fff;border-radius:16px;padding:18px 16px;box-shadow:var(--shadow);
      border:1px solid var(--border);transition:transform .15s ease, box-shadow .15s ease;
      display:flex;flex-direction:column;gap:10px;
    }
    .pkg-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}
    .pkg-size{font-size:24px;font-weight:800;color:var(--navy);}
    .pkg-validity{font-size:12px;color:var(--muted);font-weight:600;}
    .pkg-price{font-size:19px;font-weight:800;color:var(--gold-2);margin-top:2px;}
    .empty-state{padding:40px 16px;text-align:center;color:var(--muted);}
    .empty-state .big-icon{display:flex;justify-content:center;margin-bottom:10px;color:var(--muted);}

    footer.store-footer{padding:30px 0 60px;text-align:center;color:var(--muted);font-size:13px;}
    footer.store-footer a{color:var(--navy-2);font-weight:700;}

    /* ---------- Modal ---------- */
    .overlay{
      position:fixed;inset:0;background:rgba(11,28,51,.55);backdrop-filter:blur(2px);
      display:flex;align-items:flex-end;justify-content:center;z-index:200;
      animation:fadeIn .15s ease;
    }
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
    @media(min-width:640px){ .overlay{align-items:center;} }
    .modal{
      background:#fff;border-radius:22px 22px 0 0;padding:24px;max-width:460px;width:100%;
      max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slideUp .2s ease;
    }
    @media(min-width:640px){ .modal{border-radius:22px;} }
    @keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
    .modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
    .modal-head h3{margin:0;font-size:19px;color:var(--navy);}
    .modal-close{background:#f1f4fa;border:none;width:32px;height:32px;border-radius:10px;color:var(--muted);display:flex;align-items:center;justify-content:center;}

    .field{margin-bottom:14px;}
    .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;margin-bottom:6px;}
    .field input,.field select,.field textarea{
      width:100%;padding:12px 13px;border:1.5px solid var(--border);border-radius:11px;font-size:14.5px;
      background:#fafbfd;transition:.15s;
    }
    .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--navy-3);background:#fff;}
    .field input[type="color"]{padding:4px;height:46px;cursor:pointer;}
    .field input[disabled]{opacity:.6;cursor:not-allowed;}
    .hint{font-size:12px;color:var(--muted);margin-top:5px;}
    /* iOS Safari auto-zooms the page on focus if an input's font-size is under 16px. */
    @media(max-width:640px){
      .field input,.field select,.field textarea,.price-input{font-size:16px;}
    }

    .pay-box{background:var(--warn-bg);border:1px solid #f7d9a6;border-radius:14px;padding:14px 16px;margin-bottom:16px;}
    .pay-box strong{color:#8a5a05;}
    .pay-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:5px 0;}
    .pay-row b{font-size:16px;}

    .success-panel{text-align:center;padding:10px 4px 4px;}
    .success-check{
      width:64px;height:64px;border-radius:50%;background:var(--success-bg);color:var(--success);
      display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
    }
    .order-ref{
      font-family:'SFMono-Regular',Consolas,monospace;font-size:20px;font-weight:800;color:var(--navy);
      background:#f1f4fa;padding:10px 14px;border-radius:12px;display:inline-block;margin:8px 0 16px;letter-spacing:.5px;
    }

    /* ---------- Admin shell ---------- */
    .admin-body{display:flex;min-height:100vh;}
    .admin-side{
      width:230px;flex-shrink:0;background:linear-gradient(180deg,var(--navy),var(--navy-2));color:#fff;
      padding:22px 16px;display:flex;flex-direction:column;gap:4px;
    }
    .admin-side .brand{margin-bottom:22px;}
    .side-link{
      padding:11px 13px;border-radius:11px;font-weight:600;font-size:14.5px;color:#cfd9ee;
      display:flex;align-items:center;gap:10px;transition:.15s;
    }
    .side-link:hover{background:rgba(255,255,255,.08);color:#fff;}
    .side-link.active{background:rgba(255,201,60,.16);color:var(--gold);}
    .side-foot{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:#93a3c2;}
    .admin-main{flex:1;padding:26px 30px 60px;min-width:0;}
    .admin-topbar{display:none;}
    @media(max-width:820px){
      .admin-side{position:fixed;left:-260px;top:0;bottom:0;z-index:100;transition:left .2s ease;box-shadow:var(--shadow-lg);}
      .admin-side.open{left:0;}
      .admin-main{padding:18px 16px 50px;}
      .admin-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
      .side-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;}
      .side-scrim.open{display:block;}
    }

    .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:26px;}
    .stat-card{border-radius:18px;padding:20px;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden;}
    .stat-card .stat-icon{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
    .stat-card .stat-label{font-size:13px;opacity:.92;font-weight:600;}
    .stat-card .stat-value{font-size:28px;font-weight:800;margin-top:6px;}
    .stat-1{background:linear-gradient(135deg,#12b886,#0a8f6c);}
    .stat-2{background:linear-gradient(135deg,#7c6cf7,#4b3cd6);}
    .stat-3{background:linear-gradient(135deg,#f7a531,#e8791a);}
    .stat-4{background:linear-gradient(135deg,#f4436c,#d81c53);}

    table.data-table{width:100%;border-collapse:collapse;font-size:13.5px;}
    .table-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--border);}
    table.data-table th{
      text-align:left;background:#f7f9fc;color:var(--muted);font-size:11px;letter-spacing:.4px;text-transform:uppercase;
      padding:12px 14px;white-space:nowrap;
    }
    table.data-table td{padding:12px 14px;border-top:1px solid var(--border);white-space:nowrap;}
    table.data-table tr:hover td{background:#fafbfe;}
    .price-input{width:80px;padding:8px 9px;border:1.5px solid var(--border);border-radius:9px;font-size:13.5px;}
    .profit-pos{color:var(--success);font-weight:700;}
    .profit-neg{color:var(--danger);font-weight:700;}

    .badge{padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;display:inline-block;}
    .badge-pending{background:var(--warn-bg);color:var(--warn);}
    .badge-paid{background:#e7f0fe;color:#1d4ed8;}
    .badge-processing{background:#eef1ff;color:#4b3cd6;}
    .badge-delivered{background:var(--success-bg);color:var(--success);}
    .badge-failed{background:var(--danger-bg);color:var(--danger);}
    .badge-cancelled{background:#f1f4fa;color:var(--muted);}

    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
    .toolbar select{padding:9px 12px;border-radius:10px;border:1.5px solid var(--border);font-size:13.5px;}

    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    @media(max-width:520px){.form-grid{grid-template-columns:1fr;}}

    .lock-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
      background:radial-gradient(circle at 30% 20%,var(--navy-3),var(--navy) 70%);}
    .lock-card{background:#fff;border-radius:20px;padding:34px 28px;max-width:400px;width:100%;text-align:center;box-shadow:var(--shadow-lg);}
    .lock-icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;background:var(--warn-bg);color:var(--warn);}
    .fatal-icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;background:var(--danger-bg);color:var(--danger);}

    .row-actions{display:flex;gap:6px;flex-wrap:wrap;}
    .switch{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);}
    .switch input{width:38px;height:20px;}
  </style>
</head>
<body>
  <div id="app">
    <div class="boot-loader">
      <div class="spinner"></div>
      <div>Loading…</div>
    </div>
  </div>
  <div id="toast-stack"></div>

  <script>
    window.__INITIAL_PAGE__ = "<?= initialPage ?>";
    window.__APP_URL__ = "<?= appUrl ?>";
  </script>

      tag: '<path d="M20.59 13.41L13.42 20.58a2 2 0 0 1-2.83 0L2.59 12.59V2h10.59l7.41 7.41a2 2 0 0 1 0 2.83z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line>',

    function icon(name, size) {
      size = size || 20;
      return '<svg class="ico" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (ICON_PATHS[name] || '') + '</svg>';
    }
    function iconDot(size) {
      size = size || 9;
      return '<svg class="ico" width="' + size + '" height="' + size + '" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"></circle></svg>';
    }

    // ======================================================================
    // Theme — the admin picks 2 colors; the rest of the palette (hover/dark
    // shades) is derived here so both the storefront and admin reskin
    // together from one "system color" choice.
    // ======================================================================
    function clamp255(n) { return Math.max(0, Math.min(255, Math.round(n))); }
    function shade(hex, percent) {
      hex = String(hex || '').replace('#', '');
      if (hex.length === 3) hex = hex.split('').map(function (c) { return c + c; }).join('');
      if (!/^[0-9a-f]{6}$/i.test(hex)) return hex ? '#' + hex : '#0f2747';
      var num = parseInt(hex, 16);
      var r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
      function adjust(c) { return clamp255(c + (percent / 100) * (percent > 0 ? (255 - c) : c)); }
      r = adjust(r); g = adjust(g); b = adjust(b);
      return '#' + [r, g, b].map(function (v) { return v.toString(16).padStart(2, '0'); }).join('');
    }
    function applyTheme(primary, accent) {
      primary = /^#[0-9a-f]{6}$/i.test(primary || '') ? primary : '#0f2747';
      accent = /^#[0-9a-f]{6}$/i.test(accent || '') ? accent : '#ffc93c';
      var root = document.documentElement.style;
      root.setProperty('--navy', primary);
      root.setProperty('--navy-2', shade(primary, 18));
      root.setProperty('--navy-3', shade(primary, 34));
      root.setProperty('--gold', accent);
      root.setProperty('--gold-2', shade(accent, -14));
    }

    // ======================================================================
    // Helpers
    // ======================================================================
    var ADMIN_TOKEN_KEY = 'dbs_admin_token';
    var STATE = {
      page: window.__INITIAL_PAGE__ || 'store',
      store: null,
      admin: null,
      adminToken: '',
      currentNetwork: 'MTN',
      adminTab: 'dashboard',
      orderFilter: 'All',
      pendingPackage: null,
      carouselIndex: 0,
      carouselTimer: null
    };
    try { STATE.adminToken = localStorage.getItem(ADMIN_TOKEN_KEY) || ''; } catch (e) { STATE.adminToken = ''; }

    function $(sel, root) { return (root || document).querySelector(sel); }
    function $$all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
    function el(html) {
      var t = document.createElement('template');
      t.innerHTML = html.trim();
      return t.content.firstChild;
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function money(settings, n) {
      var sym = (settings && settings.currency) || 'GH₵';
      return sym + Number(n || 0).toFixed(2);
    }
    function toast(message, type) {
      var stack = $('#toast-stack');
      var node = el('<div class="toast">' + esc(message) + '</div>');
      if (type) node.classList.add(type);
      stack.appendChild(node);
      setTimeout(function () {
        node.style.transition = 'opacity .25s';
        node.style.opacity = '0';
        setTimeout(function () { node.remove(); }, 250);
      }, 3800);
    }
    function navigateTo(page) {
      var base = window.__APP_URL__ || '';
      var url = base + (base.indexOf('?') === -1 ? '?' : '&') + 'page=' + page;
      try { window.top.location.href = url; } catch (e) { window.location.href = url; }
    }
    function run(fnName) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function (resolve, reject) {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (err) { reject(err); })[fnName].apply(null, args);
      });
    }
    // Admin-only calls: auto-injects the session token, and auto-logs-out
    // back to the login form if the server says the session has expired.
    function runAdmin(fnName) {
      var args = Array.prototype.slice.call(arguments, 1);
      return run.apply(null, [fnName, STATE.adminToken].concat(args)).catch(function (err) {
        var msg = (err && err.message) || String(err);
        if (msg.indexOf('ACCESS_DENIED') !== -1) {
          clearAdminToken();
          renderLoginForm();
          toast('Your session expired — please log in again.', 'error');
        }
        throw err;
      });
    }
    function clearAdminToken() {
      STATE.adminToken = '';
      try { localStorage.removeItem(ADMIN_TOKEN_KEY); } catch (e) { /* ignore */ }
    }
    function setBusy(btn, busy, busyLabel) {
      if (!btn) return;
      if (busy) {
        btn.dataset.label = btn.dataset.label || btn.innerHTML;
        btn.textContent = busyLabel || 'Please wait…';
        btn.disabled = true;
      } else {
        btn.innerHTML = btn.dataset.label || btn.innerHTML;
        btn.disabled = false;
      }
    }

    var STATUS_CLASS = {
      'Pending Payment': 'badge-pending',
      'Paid - Awaiting Fulfillment': 'badge-paid',
      'Processing': 'badge-processing',

      'Failed': 'badge-failed',
      'Cancelled': 'badge-cancelled'

    function loadStore() {
      run('getStoreBootstrap').then(function (data) {
        STATE.store = data;

        var networks = data.networks || [];

        renderStore();
      }).catch(function (err) { renderFatal(err); });

    // ---------------- Carousel ----------------
    function renderCarousel(images) {
      var wrap = $('#carousel-wrap');
      if (STATE.carouselTimer) { clearInterval(STATE.carouselTimer); STATE.carouselTimer = null; }
      if (!wrap) return;
      if (!images.length) { wrap.innerHTML = ''; return; }

      STATE.carouselIndex = 0;
      var slides = images.map(function (img, i) {
        return '<div class="carousel-slide' + (i === 0 ? ' active' : '') + '" data-i="' + i + '">' +
          '<img src="' + esc(img.url) + '" alt="' + esc(img.caption || '') + '" loading="' + (i === 0 ? 'eager' : 'lazy') + '">' +
          (img.caption ? '<div class="carousel-caption">' + esc(img.caption) + '</div>' : '') +
        '</div>';
      }).join('');
      var dots = images.map(function (img, i) {
        return '<button class="carousel-dot' + (i === 0 ? ' active' : '') + '" data-i="' + i + '" aria-label="Slide ' + (i + 1) + '"></button>';
      }).join('');

      wrap.innerHTML = '<div class="carousel">' + slides +
        (images.length > 1 ?
          '<button class="carousel-arrow prev">' + icon('chevronLeft', 18) + '</button>' +
          '<button class="carousel-arrow next">' + icon('chevronRight', 18) + '</button>' +
          '<div class="carousel-dots">' + dots + '</div>'
          : '') +
        '</div>';

      function goTo(i) {
        var n = images.length;
        STATE.carouselIndex = ((i % n) + n) % n;
        $$all('.carousel-slide', wrap).forEach(function (el2, idx) { el2.classList.toggle('active', idx === STATE.carouselIndex); });
        $$all('.carousel-dot', wrap).forEach(function (el2, idx) { el2.classList.toggle('active', idx === STATE.carouselIndex); });
      }
      function next() { goTo(STATE.carouselIndex + 1); }
      function prev() { goTo(STATE.carouselIndex - 1); }

      if (images.length > 1) {
        $$all('.carousel-dot', wrap).forEach(function (dot) {
          dot.addEventListener('click', function () { goTo(Number(dot.dataset.i)); resetTimer(); });
        });
        wrap.querySelector('.carousel-arrow.next').addEventListener('click', function () { next(); resetTimer(); });
        wrap.querySelector('.carousel-arrow.prev').addEventListener('click', function () { prev(); resetTimer(); });
        function resetTimer() {
          if (STATE.carouselTimer) clearInterval(STATE.carouselTimer);
          STATE.carouselTimer = setInterval(next, 4500);
        }
        resetTimer();
      }
    }

    function renderBannerHtml(banner) {
      if (!banner || !banner.enabled || !banner.text) return '';
      var statusClass = 'status-' + (['good', 'delayed', 'down'].indexOf(banner.status) === -1 ? 'good' : banner.status);
      var text = iconDot(10) + '&nbsp; ' + esc(banner.text);
      var sep = '&nbsp;&nbsp;&nbsp;&nbsp;•&nbsp;&nbsp;&nbsp;&nbsp;';
      return '<div class="status-banner ' + statusClass + '"><span class="marquee-track">' + text + sep + text + sep + '</span></div>';
    }

    function waNumber(n) {
      n = String(n || '').replace(/\D/g, '');
      if (n.indexOf('0') === 0) n = '233' + n.substring(1);
      return n;
    }

    function renderNetworkTabs() {
      var wrap = $('#net-tabs');
      wrap.innerHTML = '';
      (STATE.store.networks || []).forEach(function (n) {
        var count = (STATE.store.packagesByNetwork[n] || []).length;
        var btn = el('<button class="net-tab' + (STATE.currentNetwork === n ? ' active' : '') + '" data-net="' + n + '">' +
          icon('signal', 15) + ' ' + n + (count ? '' : ' <span style="opacity:.55;font-weight:600;">(soon)</span>') + '</button>');
        btn.addEventListener('click', function () { STATE.currentNetwork = n; renderNetworkTabs(); renderPkgGrid(); });
        wrap.appendChild(btn);
      });
    }

    function renderPkgGrid() {
      var grid = $('#pkg-grid');
      var packages = STATE.store.packagesByNetwork[STATE.currentNetwork] || [];
      if (!packages.length) {
        grid.style.display = 'block';
        grid.innerHTML = '<div class="empty-state card"><div class="big-icon">' + icon('clock', 32) + '</div>No ' + esc(STATE.currentNetwork) + ' bundles available right now. Check back soon!</div>';
        return;
      }
      grid.style.display = 'grid';
      grid.innerHTML = '';
      packages.forEach(function (p) {
        var card = el(
          '<div class="pkg-card">' +
            '<div><div class="pkg-size">' + esc(p.size) + '</div><div class="pkg-validity">' + esc(p.validity || '') + ' validity</div></div>' +
            '<div class="pkg-price">' + money(STATE.store.settings, p.price) + '</div>' +
            '<button class="btn btn-navy btn-block btn-sm">Buy now</button>' +
          '</div>'
        );
        card.querySelector('button').addEventListener('click', function () { openBuyModal(p); });
        grid.appendChild(card);
      });
    }

    function openModal(node) {
      var overlay = el('<div class="overlay"></div>');
      overlay.appendChild(node);
      overlay.addEventListener('click', function (e) { if (e.target === overlay) overlay.remove(); });
      document.body.appendChild(overlay);
      return overlay;
    }

      var s = STATE.store.settings;

              '<div class="pay-row"><span>Amount</span><b>' + money(s, pkg.price) + '</b></div>'

          '</div>' +
          '<div style="margin-bottom:10px;"><strong>Step 2 — Confirm your order</strong></div>' +
          '<form id="order-form">' +
            '<div class="field"><label>Your name</label><input required name="customerName" placeholder="e.g. Ama Boateng"></div>' +

      modal.querySelector('#order-form').addEventListener('submit', function (e) {
        e.preventDefault();

        var btn = e.target.querySelector('button[type="submit"]');
        setBusy(btn, true, 'Submitting…');
        run('submitOrder', payload).then(function (res) {
          overlay.remove();
          showOrderSuccess(res);

          setBusy(btn, false);
          toast(err.message || String(err), 'error');

      });

            '<a href="#" class="side-link" id="view-store">' + icon('eye', 17) + ' View Store</a>' +

          '</div>' +
          '<div class="admin-main">' +
            '<div class="admin-topbar"><button class="icon-btn" id="menu-btn" style="background:var(--navy);color:#fff;">' + icon('menu', 18) + '</button><b>' + labelFor(STATE.adminTab) + '</b><span></span></div>' +

    function renderAdminTabContent() {
      var target = $('#admin-content');

      if (STATE.adminTab === 'pricing') return renderPricingTab(target);
      if (STATE.adminTab === 'carousel') return renderCarouselTab(target);

    // ---------------- Dashboard ----------------
    function renderDashboardTab(target) {
      var stats = STATE.admin.stats;
      var settings = STATE.admin.settings;
      target.innerHTML =
        '<div class="section-title">Store Performance</div>' +
        '<p class="section-sub">Profit counts orders once payment is confirmed.</p>' +
        '<div class="stat-grid">' +
          statCard('stat-1', 'wallet', 'Total Sales', money(settings, stats.totalSales)) +

    function statCard(cls, iconName, label, value) {
      return '<div class="stat-card ' + cls + '"><div class="stat-icon">' + icon(iconName, 20) + '</div><div class="stat-label">' + label + '</div><div class="stat-value">' + value + '</div></div>';

    // ---------------- Orders ----------------
    function renderOrdersTab(target) {
      var settings = STATE.admin.settings;
      var statuses = ['All'].concat(Object.keys(STATE.admin.orderStatuses).map(function (k) { return STATE.admin.orderStatuses[k]; }));
      var filtered = STATE.orderFilter === 'All' ? STATE.admin.orders : STATE.admin.orders.filter(function (o) { return o.status === STATE.orderFilter; });

      target.innerHTML =
        '<div class="section-title">Orders</div>' +
        '<p class="section-sub">Confirm MoMo payments, then fulfill via Geosam.</p>' +
        '<div class="toolbar"><select id="status-filter">' +
          statuses.map(function (s) { return '<option value="' + esc(s) + '"' + (s === STATE.orderFilter ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') +
        '</select><span class="muted" style="font-size:13px;">' + filtered.length + ' order(s)</span></div>' +
        '<div class="card" style="padding:0;overflow:hidden;">' + renderOrdersTable(filtered, settings, {}) + '</div>';

      $('#status-filter').addEventListener('change', function (e) { STATE.orderFilter = e.target.value; renderOrdersTab(target); });
      wireOrderActions(target);

    function renderOrdersTable(orders, settings, opts) {
      if (!orders.length) return '<div class="empty-state"><div class="big-icon">' + icon('fileText', 32) + '</div>No orders yet.</div>';
      var rows = orders.map(function (o) {
        var actions = '';
        if (o.status === 'Pending Payment') actions += '<button class="btn btn-success btn-sm" data-action="paid" data-id="' + esc(o.id) + '">Mark Paid</button>';
        if (o.status === 'Paid - Awaiting Fulfillment') actions += '<button class="btn btn-navy btn-sm" data-action="fulfill" data-id="' + esc(o.id) + '">Fulfill via Geosam</button>';
        if (o.status === 'Processing') {
          actions += '<button class="btn btn-navy btn-sm" data-action="checkstatus" data-id="' + esc(o.id) + '">' + icon('refresh', 14) + ' Check Geosam Status</button>';
          actions += '<button class="btn btn-success btn-sm" data-action="delivered" data-id="' + esc(o.id) + '">Mark Delivered</button>';
        }
        if (o.status !== 'Delivered' && o.status !== 'Cancelled' && o.status !== 'Failed') {
          actions += '<button class="btn btn-danger btn-sm" data-action="cancel" data-id="' + esc(o.id) + '">Cancel</button>';
        }
        return '<tr>' +
          '<td><b>' + esc(o.id) + '</b><br><span class="muted" style="font-size:11.5px;">' + fmtDate(o.timestamp) + '</span></td>' +
          '<td>' + esc(o.customerName) + '<br><span class="muted" style="font-size:11.5px;">to ' + esc(o.recipientPhone) + '</span></td>' +
          '<td>' + esc(o.network) + ' ' + esc(o.size) + '</td>' +
          '<td>' + money(settings, o.sellingPrice) + '</td>' +
          (opts.compact ? '' : '<td class="' + (o.profit >= 0 ? 'profit-pos' : 'profit-neg') + '">' + money(settings, o.profit) + '</td>') +
          '<td><span class="badge ' + (STATUS_CLASS[o.status] || '') + '">' + esc(o.status) + '</span></td>' +
          (opts.compact ? '' : '<td>' + esc(o.momoRef) + '</td>') +
          '<td><div class="row-actions">' + actions + '</div></td>' +
          '</tr>';
      }).join('');

      return '<div class="table-wrap"><table class="data-table"><thead><tr>' +
        '<th>Order</th><th>Customer</th><th>Bundle</th><th>Price</th>' +
        (opts.compact ? '' : '<th>Profit</th>') +
        '<th>Status</th>' + (opts.compact ? '' : '<th>Transaction ID</th>') + '<th>Actions</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>';
    }

    function fmtDate(d) {
      try { return new Date(d).toLocaleString(); } catch (e) { return d; }
    }

    function wireOrderActions(target) {
      $$all('button[data-action]', target).forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.dataset.id, action = btn.dataset.action;
          var map = { paid: 'markOrderPaid', fulfill: 'fulfillOrder', checkstatus: 'checkOrderGeosamStatus', delivered: 'markOrderDelivered', cancel: 'cancelOrder' };
          if (action === 'cancel' && !confirm('Cancel order ' + id + '?')) return;
          setBusy(btn, true, '…');
          runAdmin(map[action], id).then(function (res) {
            var msg = (res && res.status) ? ('Order ' + id + ' is now: ' + res.status) : ('Order ' + id + ' updated.');
            toast(msg, 'success');
            refreshAdmin();
          }).catch(function (err) {
            setBusy(btn, false);
            toast(err.message || String(err), 'error');
          });
        });
      });
    }

    // ---------------- Pricing ----------------
    function renderPricingTab(target) {
      var settings = STATE.admin.settings;
      var net = STATE.currentNetwork || STATE.admin.networks[0];
      var pkgs = STATE.admin.packages.filter(function (p) { return p.network === net; });

      target.innerHTML =
        '<div class="section-title">Package Pricing</div>' +
        '<p class="section-sub">Geosam doesn\'t provide a live price list — set base prices to match your Geosam dashboard/shop. Your selling price must be higher than the base price. Profit becomes available once an order is delivered.</p>' +
        '<div class="toolbar">' +
          '<select id="pricing-net">' + STATE.admin.networks.map(function (n) { return '<option value="' + n + '"' + (n === net ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select>' +
          '<button class="btn btn-navy btn-sm" id="add-pkg-btn">' + icon('plus', 14) + ' Add package</button>' +
        '</div>' +
        '<div class="card" style="padding:0;overflow:hidden;">' + renderPricingTable(pkgs, settings) + '</div>' +
        '<div id="add-pkg-form-holder"></div>';

      $('#pricing-net').addEventListener('change', function (e) { STATE.currentNetwork = e.target.value; renderPricingTab(target); });
      $('#add-pkg-btn').addEventListener('click', function () { toggleAddPackageForm(net); });
      wirePricingTable(target, settings);

    function renderPricingTable(pkgs, settings) {
      if (!pkgs.length) return '<div class="empty-state"><div class="big-icon">' + icon('tag', 32) + '</div>No packages yet for this network. Click "Add package" to create one.</div>';
      var rows = pkgs.map(function (p) {
        return '<tr data-id="' + esc(p.id) + '">' +
          '<td><b>' + esc(p.size) + '</b><br><span class="muted" style="font-size:11.5px;">' + esc(p.validity || '') + '</span></td>' +
          '<td>' + money(settings, p.basePrice) + '</td>' +
          '<td><input class="price-input" type="number" step="0.01" value="' + p.sellingPrice.toFixed(2) + '"></td>' +
          '<td class="profit-cell ' + (p.profit >= 0 ? 'profit-pos' : 'profit-neg') + '">' + money(settings, p.profit) + '</td>' +
          '<td><label class="switch"><input type="checkbox" data-active-toggle ' + (p.active ? 'checked' : '') + '> ' + (p.active ? 'Visible' : 'Hidden') + '</label></td>' +
          '<td><div class="row-actions">' +
            '<button class="btn btn-outline btn-sm" data-save>Save</button>' +
            '<button class="btn btn-danger btn-sm" data-delete>' + icon('trash', 14) + '</button>' +
          '</div></td>' +
        '</tr>';
      }).join('');
      return '<div class="table-wrap"><table class="data-table"><thead><tr>' +
        '<th>Size</th><th>Base Price</th><th>Your Selling Price</th><th>Profit</th><th>Visible</th><th>Actions</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>';
    }

    function wirePricingTable(target, settings) {
      $$all('tr[data-id]', target).forEach(function (tr) {
        var id = tr.dataset.id;
        var priceInput = tr.querySelector('.price-input');
        var profitCell = tr.querySelector('.profit-cell');
        var basePrice = parseFloat(tr.children[1].textContent.replace(/[^\d.]/g, ''));

        priceInput.addEventListener('input', function () {
          var val = parseFloat(priceInput.value) || 0;
          var profit = val - basePrice;
          profitCell.textContent = money(settings, profit);
          profitCell.className = 'profit-cell ' + (profit >= 0 ? 'profit-pos' : 'profit-neg');
        });

        tr.querySelector('[data-save]').addEventListener('click', function (e) {
          var btn = e.target;
          setBusy(btn, true, 'Saving…');
          runAdmin('savePackageSellingPrice', id, priceInput.value).then(function () {
            setBusy(btn, false);
            toast('Price saved.', 'success');
            refreshAdmin();
          }).catch(function (err) { setBusy(btn, false); toast(err.message || String(err), 'error'); });
        });

        tr.querySelector('[data-delete]').addEventListener('click', function () {
          if (!confirm('Delete this package from your store?')) return;
          runAdmin('deletePackage', id).then(function () { toast('Deleted.', 'success'); refreshAdmin(); })
            .catch(function (err) { toast(err.message || String(err), 'error'); });
        });

        tr.querySelector('[data-active-toggle]').addEventListener('change', function (e) {
          runAdmin('togglePackageActive', id, e.target.checked).then(function () {
            toast('Updated.', 'success'); refreshAdmin();
          }).catch(function (err) { toast(err.message || String(err), 'error'); refreshAdmin(); });
        });
      });
    }

    function toggleAddPackageForm(net) {
      var holder = $('#add-pkg-form-holder');
      if (holder.children.length) { holder.innerHTML = ''; return; }
      holder.appendChild(el(
        '<div class="card" style="margin-top:16px;">' +
          '<div class="section-title" style="font-size:16px;">Add package manually</div>' +
          '<form id="add-pkg-form">' +
            '<div class="form-grid">' +
              '<div class="field"><label>Network</label><select name="network">' + STATE.admin.networks.map(function (n) { return '<option' + (n === net ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select></div>' +
              '<div class="field"><label>Size (e.g. 1GB)</label><input required name="size" id="pkg-size-input"></div>' +
              '<div class="field"><label>Data amount in MB (sent to Geosam)</label><input required type="number" step="1" name="amountMB" id="pkg-mb-input" placeholder="1000 = 1GB"></div>' +
              '<div class="field"><label>Validity (e.g. 30 Days)</label><input name="validity" placeholder="30 Days"></div>' +
              '<div class="field"><label>Base price</label><input required type="number" step="0.01" name="basePrice"></div>' +
              '<div class="field"><label>Your selling price</label><input required type="number" step="0.01" name="sellingPrice"></div>' +
            '</div>' +
            '<button class="btn btn-navy" type="submit">Add package</button>' +
          '</form>' +
        '</div>'
      ));
      holder.querySelector('#pkg-size-input').addEventListener('blur', function (e) {
        var mbInput = holder.querySelector('#pkg-mb-input');
        if (mbInput.value) return;
        var match = /([\d.]+)\s*(GB|MB)/i.exec(e.target.value || '');
        if (!match) return;
        var n = parseFloat(match[1]);
        mbInput.value = /gb/i.test(match[2]) ? Math.round(n * 1000) : Math.round(n);
      });
      holder.querySelector('#add-pkg-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var fd = new FormData(e.target);
        var payload = {}; fd.forEach(function (v, k) { payload[k] = v; });
        var btn = e.target.querySelector('button[type="submit"]');
        setBusy(btn, true, 'Adding…');
        runAdmin('addManualPackage', payload).then(function () {
          toast('Package added.', 'success');
          refreshAdmin();
        }).catch(function (err) { setBusy(btn, false); toast(err.message || String(err), 'error'); });
      });
    }

    // ---------------- Carousel ----------------
    function renderCarouselTab(target) {
      target.innerHTML =
        '<div class="section-title">' + icon('image', 20) + ' Storefront Carousel</div>' +
        '<p class="section-sub">Upload photos for the rotating banner customers see at the top of your store (JPG/PNG/WebP, max 5MB).</p>' +
        '<div class="card">' +
          '<form id="carousel-upload-form">' +
            '<div class="field"><label>Photo</label><input required type="file" accept="image/*" name="file" id="carousel-file-input"></div>' +
            '<div class="field"><label>Caption (optional)</label><input name="caption" placeholder="e.g. Instant MTN, Telecel &amp; AirtelTigo bundles"></div>' +
            '<button class="btn btn-navy" type="submit">' + icon('upload', 16) + ' Upload photo</button>' +
          '</form>' +
          '<div id="carousel-upload-result" style="margin-top:10px;"></div>' +
        '</div>' +
        '<div id="carousel-admin-grid"></div>';

      renderCarouselAdminGrid(target);

      target.querySelector('#carousel-upload-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var fileInput = target.querySelector('#carousel-file-input');
        var file = fileInput.files && fileInput.files[0];
        if (!file) return;
        var caption = target.querySelector('[name="caption"]').value;
        var btn = e.target.querySelector('button[type="submit"]');
        setBusy(btn, true, 'Uploading…');
        $('#carousel-upload-result', target).innerHTML = '';

        var reader = new FileReader();
        reader.onload = function () {
          runAdmin('uploadCarouselImage', { dataUrl: reader.result, caption: caption, fileName: file.name }).then(function () {
            setBusy(btn, false);
            e.target.reset();
            toast('Photo uploaded.', 'success');
            refreshAdmin();
          }).catch(function (err) {
            setBusy(btn, false);
            $('#carousel-upload-result', target).innerHTML = '<div class="hint" style="color:var(--danger);">' + esc(err.message || err) + '</div>';
          });
        };
        reader.onerror = function () {
          setBusy(btn, false);
          $('#carousel-upload-result', target).innerHTML = '<div class="hint" style="color:var(--danger);">Could not read that file. Please try another image.</div>';
        };
        reader.readAsDataURL(file);
      });
    }

          runAdmin('toggleCarouselActive', id, e.target.checked).then(function () {

      renderBannerForm(target, s);
    }

    // ---------------- Appearance (system color) ----------------
    function renderThemeForm(target, s) {
      var holder = el('<div class="card" style="margin-top:16px;"></div>');
      holder.innerHTML =
        '<div class="section-title" style="font-size:17px;">' + icon('droplet', 19) + ' System Color</div>' +
        '<p class="section-sub">Pick your brand colors — everything else (hover states, gradients) is generated from these two.</p>' +
        '<form id="theme-form">' +
          '<div class="form-grid">' +
            '<div class="field"><label>Primary color</label><input type="color" name="THEME_PRIMARY" value="' + esc(s.themePrimary || '#0f2747') + '"></div>' +
            '<div class="field"><label>Accent color</label><input type="color" name="THEME_ACCENT" value="' + esc(s.themeAccent || '#ffc93c') + '"></div>' +
          '</div>' +
          '<button class="btn btn-navy" type="submit">Save colors</button>' +
          '<button class="btn btn-outline" type="button" id="theme-reset" style="margin-left:8px;">Reset to default</button>' +
        '</form>';
      target.appendChild(holder);

      var form = holder.querySelector('#theme-form');
      form.addEventListener('input', function () {
        var fd = new FormData(form);
        applyTheme(fd.get('THEME_PRIMARY'), fd.get('THEME_ACCENT'));
      });
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var fd = new FormData(form);
        var payload = { THEME_PRIMARY: fd.get('THEME_PRIMARY'), THEME_ACCENT: fd.get('THEME_ACCENT') };
        var btn = e.target.querySelector('button[type="submit"]');
        setBusy(btn, true, 'Saving…');
        runAdmin('saveAdminSettings', payload).then(function () {
          setBusy(btn, false);
          toast('Colors saved.', 'success');
          refreshAdmin();
        }).catch(function (err) { setBusy(btn, false); toast(err.message || String(err), 'error'); });
      });
      holder.querySelector('#theme-reset').addEventListener('click', function () {
        form.querySelector('[name="THEME_PRIMARY"]').value = '#0f2747';
        form.querySelector('[name="THEME_ACCENT"]').value = '#ffc93c';
        applyTheme('#0f2747', '#ffc93c');
      });
    }

    var BANNER_STATUS_DEFAULTS = {
      good: 'Network is good — orders are going through smoothly!',
      delayed: 'Network is a bit slow right now — deliveries may take longer than usual.',
      down: 'Network issues right now — deliveries may be delayed. Sorry for the inconvenience!'
    };

    // Mirrors composeBanner_() in Code.gs, for an instant live preview while editing.
    function composeBannerPreview(v) {
      var status = BANNER_STATUS_DEFAULTS.hasOwnProperty(v.BANNER_STATUS) ? v.BANNER_STATUS : 'good';
      var message = (v.BANNER_MESSAGE || '').trim() || BANNER_STATUS_DEFAULTS[status];
      var etas = [];
      if (v.MTN_DELIVERY_TIME) etas.push('MTN: ' + v.MTN_DELIVERY_TIME);
      if (v.TELECEL_DELIVERY_TIME) etas.push('Telecel: ' + v.TELECEL_DELIVERY_TIME);
      if (v.AIRTELTIGO_DELIVERY_TIME) etas.push('AirtelTigo: ' + v.AIRTELTIGO_DELIVERY_TIME);
      return { status: status, text: message + (etas.length ? '  ·  Delivery time — ' + etas.join('  ·  ') : '') };
    }

    function renderBannerForm(target, s) {
      var holder = el('<div class="card" style="margin-top:16px;"></div>');
      holder.innerHTML =
        '<div class="section-title" style="font-size:17px;">' + icon('megaphone', 19) + ' Live Status Banner</div>' +
        '<p class="section-sub">A scrolling banner on your storefront telling customers how the network is running and how long delivery is taking.</p>' +
        '<div id="banner-preview" style="margin-bottom:16px;border-radius:12px;overflow:hidden;"></div>' +
        '<form id="banner-form">' +
          '<label class="switch" style="margin-bottom:14px;"><input type="checkbox" name="BANNER_ENABLED" value="true"' + (s.bannerEnabled ? ' checked' : '') + '> Show this banner on my storefront</label>' +
          '<div class="form-grid">' +
            '<div class="field"><label>Network status</label><select name="BANNER_STATUS">' +
              '<option value="good"' + (s.bannerStatus === 'good' ? ' selected' : '') + '>Good</option>' +
              '<option value="delayed"' + (s.bannerStatus === 'delayed' ? ' selected' : '') + '>Delayed / slow</option>' +
              '<option value="down"' + (s.bannerStatus === 'down' ? ' selected' : '') + '>Down / major issues</option>' +
            '</select></div>' +
            '<div class="field"><label>MTN delivery time</label><input name="MTN_DELIVERY_TIME" value="' + esc(s.mtnDeliveryTime) + '" placeholder="e.g. 10-30 mins"></div>' +
            '<div class="field"><label>Telecel delivery time</label><input name="TELECEL_DELIVERY_TIME" value="' + esc(s.telecelDeliveryTime) + '" placeholder="e.g. 15-45 mins"></div>' +
            '<div class="field"><label>AirtelTigo delivery time</label><input name="AIRTELTIGO_DELIVERY_TIME" value="' + esc(s.airtelTigoDeliveryTime) + '" placeholder="e.g. 20-45 mins"></div>' +
          '</div>' +
          '<div class="field"><label>Custom message (optional)</label><textarea name="BANNER_MESSAGE" rows="2" placeholder="Leave blank to auto-generate from the status above">' + esc(s.bannerMessage) + '</textarea>' +
            '<div class="hint">Leave a network\'s delivery time blank to leave it out of the banner.</div></div>' +
          '<button class="btn btn-navy" type="submit">Save banner</button>' +
        '</form>';
      target.appendChild(holder);

      function currentFormValues() {
        var fd = new FormData(holder.querySelector('#banner-form'));
        var v = {}; fd.forEach(function (val, key) { v[key] = val; });
        return v;
      }
      function updatePreview() {
        var preview = composeBannerPreview(currentFormValues());
        holder.querySelector('#banner-preview').innerHTML =
          '<div class="status-banner status-' + preview.status + '" style="overflow:visible;white-space:normal;padding:10px 14px;">' +
          iconDot(9) + '&nbsp; ' + esc(preview.text) + '</div>';
      }
      updatePreview();
      ['input', 'change'].forEach(function (evt) {
        holder.querySelector('#banner-form').addEventListener(evt, updatePreview);
      });

      holder.querySelector('#banner-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var payload = currentFormValues();
        payload.BANNER_ENABLED = holder.querySelector('[name="BANNER_ENABLED"]').checked ? 'true' : 'false';
        var btn = e.target.querySelector('button[type="submit"]');
        setBusy(btn, true, 'Saving…');
        runAdmin('saveAdminSettings', payload).then(function () {
          setBusy(btn, false);
          toast('Banner saved.', 'success');
          refreshAdmin();
        }).catch(function (err) { setBusy(btn, false); toast(err.message || String(err), 'error'); });
      });
    }

    // ---------------- API Settings ----------------
    function renderApiTab(target) {
      var s = STATE.admin.settings;
      target.innerHTML =
        '<div class="section-title">Geosam API Settings</div>' +
        '<p class="section-sub">While Mode is "Mock", orders are simulated so you can test the whole flow before going live. Geosam has no bundle price-list endpoint, so pricing always stays manual (see the Pricing tab).</p>' +
        '<div class="card">' +
          '<form id="api-form">' +
            '<div class="field"><label>API base URL</label><input name="GEOSAM_API_BASE" value="' + esc(s.geosamApiBase) + '" placeholder="https://www.geosams.com"></div>' +
            '<div class="field"><label>API token ' + (s.geosamApiKeySet ? '<span class="muted">(currently set — leave blank to keep it)</span>' : '') + '</label><input type="password" name="GEOSAM_API_KEY" placeholder="' + (s.geosamApiKeySet ? '••••••••' : 'Paste your Geosam API token') + '"><div class="hint">From your Geosam dashboard, once your API account is approved.</div></div>' +
            '<div class="field"><label>API mode</label><select name="GEOSAM_MODE">' +
              '<option value="mock"' + (s.geosamMode !== 'live' ? ' selected' : '') + '>Mock (simulate orders)</option>' +
              '<option value="live"' + (s.geosamMode === 'live' ? ' selected' : '') + '>Live (real Geosam API)</option>' +
            '</select></div>' +
            '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
              '<button class="btn btn-navy" type="submit">Save API settings</button>' +
              '<button class="btn btn-outline" type="button" id="test-conn-btn">Test connection</button>' +
              '<button class="btn btn-outline" type="button" id="balance-btn">' + icon('wallet', 14) + ' Check wallet balance</button>' +
            '</div>' +
          '</form>' +
          '<div id="test-result" style="margin-top:12px;"></div>' +
          '<div id="balance-result" style="margin-top:12px;"></div>' +
        '</div>';

      target.querySelector('#api-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var fd = new FormData(e.target);
        var payload = {}; fd.forEach(function (v, k) { payload[k] = v; });
        var btn = e.target.querySelector('button[type="submit"]');
        setBusy(btn, true, 'Saving…');
        runAdmin('saveAdminSettings', payload).then(function () {
          setBusy(btn, false);
          toast('API settings saved.', 'success');
          refreshAdmin();
        }).catch(function (err) { setBusy(btn, false); toast(err.message || String(err), 'error'); });
      });
      target.querySelector('#test-conn-btn').addEventListener('click', function () {
        var btn = target.querySelector('#test-conn-btn');
        setBusy(btn, true, 'Testing…');
        runAdmin('testGeosamConnection').then(function (res) {
          setBusy(btn, false);
          $('#test-result', target).innerHTML = '<div class="hint" style="color:' + (res.success ? 'var(--success)' : 'var(--danger)') + ';">' + esc(res.message) + '</div>';
        }).catch(function (err) { setBusy(btn, false); toast(err.message || String(err), 'error'); });
      });
      target.querySelector('#balance-btn').addEventListener('click', function () {
        var btn = target.querySelector('#balance-btn');
        setBusy(btn, true, 'Checking…');
        runAdmin('getGeosamWalletBalance').then(function (res) {
          setBusy(btn, false);
          if (!res.success) {
            $('#balance-result', target).innerHTML = '<div class="hint" style="color:var(--danger);">' + esc(res.message) + '</div>';
            return;
          }
          $('#balance-result', target).innerHTML =
            '<div class="pay-box"><strong>Geosam wallet balance</strong>' +
            '<div class="pay-row"><span>MTN</span><b>' + esc(res.balances.MTN) + '</b></div>' +
            '<div class="pay-row"><span>Telecel</span><b>' + esc(res.balances.Telecel) + '</b></div>' +
            '<div class="pay-row"><span>AirtelTigo</span><b>' + esc(res.balances.AirtelTigo) + '</b></div></div>';
        }).catch(function (err) { setBusy(btn, false); toast(err.message || String(err), 'error'); });
      });
    }

    // ---------------- Account ----------------
    function renderAccountTab(target) {
      var s = STATE.admin.settings;
      target.innerHTML =
        '<div class="section-title">' + icon('key', 20) + ' Account</div>' +
        '<p class="section-sub">Change your admin login. You\'ll need your current password.</p>' +
        '<div class="card">' +
          '<form id="account-form">' +
            '<div class="field"><label>Current username</label><input value="' + esc(s.adminUsername) + '" disabled></div>' +
            '<div class="field"><label>Current password</label><input required type="password" name="currentPassword" autocomplete="current-password"></div>' +
            '<div class="form-grid">' +
              '<div class="field"><label>New username / email (optional)</label><input name="newUsername" autocomplete="username" placeholder="Leave blank to keep current"></div>' +
              '<div class="field"><label>New password (optional)</label><input type="password" name="newPassword" autocomplete="new-password" placeholder="Leave blank to keep current"></div>' +
            '</div>' +
            '<button class="btn btn-navy" type="submit">Update login</button>' +
          '</form>' +
        '</div>' +
        '<div class="card" style="margin-top:16px;">' +
          '<div class="section-title" style="font-size:16px;">Log out</div>' +
          '<p class="muted" style="font-size:13.5px;margin-bottom:12px;">End this admin session on this device.</p>' +
          '<button class="btn btn-outline" id="logout-btn">' + icon('logout', 16) + ' Log out</button>' +
        '</div>';

      target.querySelector('#account-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var fd = new FormData(e.target);
        var payload = {}; fd.forEach(function (v, k) { payload[k] = v; });
        var btn = e.target.querySelector('button[type="submit"]');
        setBusy(btn, true, 'Saving…');
        runAdmin('changeAdminCredentials', payload).then(function () {
          setBusy(btn, false);
          toast('Login updated.', 'success');
          e.target.reset();
          refreshAdmin();
        }).catch(function (err) { setBusy(btn, false); toast(err.message || String(err), 'error'); });
      });

      target.querySelector('#logout-btn').addEventListener('click', function () {
        var btn = target.querySelector('#logout-btn');
        setBusy(btn, true, 'Logging out…');
        runAdmin('adminLogout').then(function () {
          clearAdminToken();
          toast('Logged out.', 'success');
          renderLoginForm();
        }).catch(function () { clearAdminToken(); renderLoginForm(); });
      });
    }

    // ======================================================================
    function renderFatal(err) {
      $('#app').innerHTML =
        '<div class="lock-screen"><div class="lock-card">' +
          '<div class="fatal-icon">' + icon('alertTriangle', 30) + '</div><h2 style="color:var(--navy);">Something went wrong</h2>' +
          '<p class="muted">' + esc(err && err.message ? err.message : String(err)) + '</p>' +
          '<button class="btn btn-navy btn-block" onclick="location.reload()">Reload</button>' +
        '</div></div>';
    }

    boot();
  })();
  </script>
</body>
</html>
